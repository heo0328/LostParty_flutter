name: Party join v3 Rules proof

on:
  workflow_dispatch:
  push:
    branches:
      - fix/bug-022-party-permissions
    paths:
      - .github/workflows/party-join-v3-proof.yml
      - tools/package.json
      - tools/package-lock.json
      - tools/party_join_v3_firebase.json
      - tools/party_join_v3_proof.rules
      - tools/party_join_v3_rules_test.mjs

permissions:
  contents: read

jobs:
  firestore-rules-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install proof dependencies
        run: npm ci --prefix tools

      - name: Run isolated v3 direct join proof
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config tools/party_join_v3_firebase.json
          --only firestore
          --project demo-party-join-v3
          "node tools/party_join_v3_rules_test.mjs"
