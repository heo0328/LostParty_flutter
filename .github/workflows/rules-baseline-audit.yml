name: Rules baseline audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix tools
      - run: node tools/rules_audit.mjs
      - name: Fixed source server boundaries once
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json --only firestore --project demo-party-group-cutover
          "node tools/rules_baseline_audit.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-baseline-audit
          path: |
            coverage/rules-audit/
            firestore-debug.log
          retention-days: 30
