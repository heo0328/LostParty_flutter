name: Party group cutover Rules regression

on:
  workflow_dispatch:
    inputs:
      dispatch_scope:
        description: Only for ownership-dispatch; baseline isolates regressions
        type: choice
        default: candidate
        options:
          - candidate
          - baseline
          - recurrence
          - targets
          - targets-fallback
          - leader-diagnosis
          - leader-max-diagnosis
          - leader-distributed-diagnosis
          - leader-distributed
          - peer-chain-only
          - peer-chain
          - last-member
          - generation
          - participation
          - occupancy
          - manual-completion
          - personal-completion
          - personal-baseline
          - orphan-cleanup
          - publish-boundaries
          - complexity-comparison
          - complexity-participation
          - complexity-position
          - complexity-personal
          - complexity-audit
          - complexity-audit-cause
          - complexity-removal-coverage
          - complexity-removal-candidate
          - complexity-removal-rejections
          - complexity-removal-bounded
          - complexity-target-scan
          - complexity-target-normal
          - complexity-rejection-phase
          - complexity-group-display
          - complexity-compact
          - complexity-compact-remaining
          - complexity-compact-final
          - completion-role
          - bug024
      case:
        description: Rules regression scope
        type: choice
        default: full
        options:
          - full
          - character-placement
          - ownership-proof
          - ownership-diagnosis
          - ownership-boundaries
          - ownership-aggregate
          - ownership-dispatch
          - ownership-coverage
          - ownership-legacy
          - ownership-cleanup
          - ownership-leader
  push:
    branches:
      - feature/party-group-command-redesign
    paths:
      - .github/workflows/party-group-cutover-rules.yml
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - tools/package.json
      - tools/package-lock.json
      - tools/group_leave_rules_test.mjs
      - tools/party_group_cutover_rules_test.mjs

permissions:
  contents: read

jobs:
  full-rules-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rules test dependencies
        run: npm ci --prefix tools

      - name: Run tracked full Rules regression
        if: inputs.case != 'ownership-proof' && inputs.case != 'ownership-diagnosis' && inputs.case != 'ownership-boundaries' && inputs.case != 'ownership-aggregate' && inputs.case != 'ownership-dispatch' && inputs.case != 'ownership-coverage' && inputs.case != 'ownership-legacy' && inputs.case != 'ownership-cleanup' && inputs.case != 'ownership-leader'
        env:
          PARTY_RULES_CASE: ${{ inputs.case }}
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/party_group_cutover_rules_test.mjs"

      - name: Run group transfer leave and disband regression
        if: inputs.case != 'character-placement' && inputs.case != 'ownership-proof' && inputs.case != 'ownership-diagnosis' && inputs.case != 'ownership-boundaries' && inputs.case != 'ownership-aggregate' && inputs.case != 'ownership-dispatch' && inputs.case != 'ownership-coverage' && inputs.case != 'ownership-legacy' && inputs.case != 'ownership-cleanup' && inputs.case != 'ownership-leader'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/group_leave_rules_test.mjs"

      - name: Run isolated ownership feasibility proof
        if: inputs.case == 'ownership-proof'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_ownership_rules_proof.mjs"

      - name: Diagnose lifecycle predicates in demo only
        if: inputs.case == 'ownership-diagnosis'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_lifecycle_predicate_diagnosis.mjs"

      - name: Diagnose atomic write boundaries in demo only
        if: inputs.case == 'ownership-boundaries'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_lifecycle_boundary_diagnosis.mjs"

      - name: Diagnose recruitment predicates in atomic transaction
        if: inputs.case == 'ownership-aggregate'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_lifecycle_boundary_diagnosis.mjs --aggregate --confirm"

      - name: Verify minimal dispatch and ownership candidates in demo only
        if: inputs.case == 'ownership-dispatch'
        env:
          DISPATCH_SCOPE: ${{ inputs.dispatch_scope }}
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_dispatch_rules_proof.mjs"

      - name: Capture lifecycle expression coverage in demo only
        if: inputs.case == 'ownership-coverage'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_lifecycle_boundary_diagnosis.mjs --coverage"

      - name: Preserve target candidate coverage evidence
        if: always() && inputs.case == 'ownership-dispatch' && inputs.dispatch_scope == 'targets'
        uses: actions/upload-artifact@v4
        with:
          name: roster-targets-coverage
          path: coverage/roster-targets/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve lifecycle coverage evidence
        if: always() && inputs.case == 'ownership-coverage'
        uses: actions/upload-artifact@v4
        with:
          name: roster-lifecycle-coverage
          path: coverage/roster-lifecycle/
          if-no-files-found: error
          retention-days: 30

      - name: Verify missing-state and legacy ownership in demo only
        if: inputs.case == 'ownership-legacy'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_legacy_rules_proof.mjs"

      - name: Preserve legacy ownership candidate
        if: always() && inputs.case == 'ownership-legacy'
        uses: actions/upload-artifact@v4
        with:
          name: roster-legacy-candidate
          path: coverage/roster-legacy/
          if-no-files-found: error
          retention-days: 30

      - name: Verify completed ownership cleanup in demo only
        if: inputs.case == 'ownership-cleanup'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_completed_cleanup_proof.mjs"

      - name: Preserve completed cleanup candidate
        if: always() && inputs.case == 'ownership-cleanup'
        uses: actions/upload-artifact@v4
        with:
          name: roster-cleanup-candidate
          path: coverage/roster-cleanup/
          if-no-files-found: error
          retention-days: 30

      - name: Verify ownership leader succession in demo only
        if: inputs.case == 'ownership-leader'
        env:
          LEADER_PROOF_SCOPE: ${{ inputs.dispatch_scope }}
        run: |
          proof_script=tools/roster_leader_cleanup_proof.mjs
          if [[ "$LEADER_PROOF_SCOPE" == peer-* ]]; then
            proof_script=tools/roster_peer_cleanup_proof.mjs
          fi
          if [[ "$LEADER_PROOF_SCOPE" == last-member ]]; then
            proof_script=tools/roster_last_member_proof.mjs
          fi
          if [[ "$LEADER_PROOF_SCOPE" == generation ]]; then
            proof_script=tools/roster_generation_proof.mjs
          fi
          if [[ "$LEADER_PROOF_SCOPE" == participation ]]; then
            proof_script=tools/roster_participation_proof.mjs
          fi
          if [[ "$LEADER_PROOF_SCOPE" == occupancy ]]; then
            proof_script=tools/roster_occupancy_proof.mjs
          fi
          if [[ "$LEADER_PROOF_SCOPE" == manual-completion ]]; then
            proof_script=tools/roster_manual_completion_proof.mjs
          fi
          if [[ "$LEADER_PROOF_SCOPE" == personal-completion || "$LEADER_PROOF_SCOPE" == personal-baseline ]]; then
            proof_script=tools/roster_personal_completion_proof.mjs
          fi
          if [[ "$LEADER_PROOF_SCOPE" == orphan-cleanup ]]; then
            proof_script=tools/roster_orphan_cleanup_proof.mjs
          fi
          proof_command="node $proof_script"
          if [[ "$LEADER_PROOF_SCOPE" == personal-completion ]]; then
            proof_command="$proof_command && node tools/roster_manual_completion_proof.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == publish-boundaries ]]; then
            export ROSTER_TRACKED_RULES=1
            node tools/integrate_roster_rules.mjs --check
            # Generation already passed on this exact Rules hash in run 37093970487.
            proof_command="node tools/roster_last_member_proof.mjs && node tools/roster_orphan_cleanup_proof.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-comparison ]]; then
            node tools/integrate_roster_rules.mjs --check
            node --test tools/roster_complexity_candidate.test.mjs
            proof_command="node tools/roster_complexity_differential.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-position ]]; then
            proof_command="node tools/roster_position_differential.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-personal ]]; then
            node --test tools/roster_personal_dedup.test.mjs
            proof_command="node tools/roster_personal_differential.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-audit ]]; then
            node tools/rules_audit.mjs
            proof_command="node tools/rules_baseline_audit.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-audit-cause ]]; then
            proof_command="node tools/rules_audit_cause.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-removal-coverage ]]; then
            export RULES_REMOVAL_COVERAGE=1
            proof_command="node tools/rules_audit_cause.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-removal-rejections ]]; then
            proof_command="node tools/rules_removal_rejection_audit.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-removal-bounded ]]; then
            node --test tools/rules_removal_rejection_candidate.test.mjs
            export RULES_REMOVAL_BOUNDED=1
            proof_command="node tools/rules_removal_rejection_audit.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-target-scan ]]; then
            node --test tools/rules_target_scan_candidate.test.mjs
            export RULES_REMOVAL_BOUNDED=1
            export RULES_TARGET_SCAN=1
            proof_command="node tools/rules_removal_rejection_audit.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-target-normal ]]; then
            node --test tools/rules_target_scan_candidate.test.mjs tools/rules_removal_rejection_candidate.test.mjs tools/rules_removal_candidate.test.mjs
            export RULES_TARGET_SCAN=1
            proof_command="node tools/rules_removal_proof.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-compact ]]; then
            node tools/integrate_roster_rules.mjs --check
            node --test tools/rules_executable_compact.test.mjs
            export RULES_TRACKED_COMPACT=1
            export RULES_TARGET_SCAN=1
            export GROUP_DISPLAY_RELAXED=1
            proof_command="node tools/rules_removal_proof.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-compact-remaining || "$LEADER_PROOF_SCOPE" == complexity-compact-final ]]; then
            node tools/integrate_roster_rules.mjs --check
            export ROSTER_COMPLEXITY_RULES_FILE="$PWD/firestore.rules"
            export ROSTER_TRACKED_RULES=1
            export RULES_BUDGET_AUDIT=1
            export GROUP_DISPLAY_RELAXED=1
            proof_command="node tools/roster_peer_cleanup_proof.mjs && node tools/roster_last_member_proof.mjs && node tools/group_leave_rules_test.mjs"
            if [[ "$LEADER_PROOF_SCOPE" == complexity-compact-final ]]; then
              proof_command="node tools/roster_last_member_proof.mjs && node tools/group_leave_rules_test.mjs"
            fi
            export LEADER_PROOF_SCOPE=''
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-group-display ]]; then
            node tools/integrate_roster_rules.mjs --check
            node --test tools/rules_group_display_candidate.test.mjs
            export GROUP_DISPLAY_RELAXED=1
            proof_command="node tools/group_leave_rules_test.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-rejection-phase ]]; then
            export RULES_REJECTION_PHASE=1
            proof_command="node tools/rules_removal_rejection_audit.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-removal-candidate ]]; then
            node --test tools/rules_removal_candidate.test.mjs
            proof_command="node tools/rules_removal_proof.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == complexity-participation ]]; then
            proof_command="node tools/roster_complexity_differential.mjs --participation-only"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == completion-role ]]; then
            node tools/integrate_roster_rules.mjs --check
            proof_command="node tools/party_completion_role_proof.mjs"
          fi
          if [[ "$LEADER_PROOF_SCOPE" == bug024 ]]; then
            node tools/integrate_roster_rules.mjs --check --review
            proof_command="node tools/bug024_preparation_proof.mjs && node tools/party_completion_role_proof.mjs && PARTY_RULES_CASE=character-placement node tools/party_group_cutover_rules_test.mjs"
          fi
          npx --yes firebase-tools@15.29.0 emulators:exec --config firebase.json --only firestore --project demo-party-group-cutover "$proof_command"

      - name: Preserve BUG-024 proof
        if: always() && inputs.dispatch_scope == 'bug024'
        uses: actions/upload-artifact@v4
        with:
          name: bug024-rules-evidence
          path: |
            coverage/bug024/
            coverage/party-completion-role/
            firestore-debug.log
          if-no-files-found: warn

      - name: Preserve bounded complexity comparison
        if: always() && inputs.case == 'ownership-leader' && startsWith(inputs.dispatch_scope, 'complexity-')
        uses: actions/upload-artifact@v4
        with:
          name: roster-complexity-comparison
          path: |
            coverage/roster-complexity/
            coverage/roster-position/
            coverage/rules-audit/
            firestore-debug.log
          if-no-files-found: error
          retention-days: 30

      - name: Preserve leader succession candidate
        if: always() && inputs.case == 'ownership-leader' && inputs.dispatch_scope != 'complexity-group-display' && inputs.dispatch_scope != 'completion-role' && inputs.dispatch_scope != 'bug024'
        uses: actions/upload-artifact@v4
        with:
          name: roster-leader-candidate
          path: coverage/roster-leader/
          if-no-files-found: error
          retention-days: 30
