name: Party group cutover Rules regression

on:
  workflow_dispatch:
    inputs:
      case:
        description: Rules regression scope
        type: choice
        default: full
        options:
          - full
          - character-placement
          - ownership-proof
          - ownership-diagnosis
          - ownership-boundaries
  push:
    branches:
      - feature/party-group-command-redesign
    paths:
      - .github/workflows/party-group-cutover-rules.yml
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - tools/package.json
      - tools/package-lock.json
      - tools/group_leave_rules_test.mjs
      - tools/party_group_cutover_rules_test.mjs

permissions:
  contents: read

jobs:
  full-rules-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rules test dependencies
        run: npm ci --prefix tools

      - name: Run tracked full Rules regression
        if: inputs.case != 'ownership-proof' && inputs.case != 'ownership-diagnosis' && inputs.case != 'ownership-boundaries'
        env:
          PARTY_RULES_CASE: ${{ inputs.case }}
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/party_group_cutover_rules_test.mjs"

      - name: Run group transfer leave and disband regression
        if: inputs.case != 'character-placement' && inputs.case != 'ownership-proof' && inputs.case != 'ownership-diagnosis' && inputs.case != 'ownership-boundaries'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/group_leave_rules_test.mjs"

      - name: Run isolated ownership feasibility proof
        if: inputs.case == 'ownership-proof'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_ownership_rules_proof.mjs"

      - name: Diagnose lifecycle predicates in demo only
        if: inputs.case == 'ownership-diagnosis'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_lifecycle_predicate_diagnosis.mjs"

      - name: Diagnose atomic write boundaries in demo only
        if: inputs.case == 'ownership-boundaries'
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config firebase.json
          --only firestore
          --project demo-party-group-cutover
          "node tools/roster_lifecycle_boundary_diagnosis.mjs"
