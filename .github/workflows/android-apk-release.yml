name: Android APK release

on:
  workflow_dispatch:
    inputs:
      artifact_target:
        description: Prepare Android APK or the web handoff artifact (no publication)
        type: choice
        required: true
        default: android
        options:
          - android
          - web
  push:
    tags:
      - "v*"

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Prepare web artifact only
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_target == 'web'
    uses: ./.github/workflows/web-release.yml
    permissions:
      contents: read

  build:
    if: github.ref != 'refs/tags/v2.1.0' && (github.event_name != 'workflow_dispatch' || inputs.artifact_target != 'web')
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      version_name: ${{ steps.metadata.outputs.version_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and release source
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          full_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          if [[ ! "$full_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "pubspec.yaml version must use <name>+<code>." >&2
            exit 1
          fi

          version_name="${BASH_REMATCH[1]}"
          version_code="${BASH_REMATCH[2]}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v${version_name}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match pubspec version $expected_tag." >&2
              exit 1
            fi

            git fetch origin main --no-tags
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag commit is not contained in origin/main." >&2
              exit 1
            fi
          fi

          artifact_name="android-apk-${version_name}-${version_code}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            asset_name="lostparty-${GITHUB_REF_NAME}-android.apk"
          else
            asset_name="lostparty-${version_name}-${version_code}-android.apk"
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Validate signing secrets and restore keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lostparty-release.jks
        run: |
          set -euo pipefail
          for value in \
            "$ANDROID_KEYSTORE_BASE64" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "One or more Android signing secrets are missing." >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lostparty-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK identity and signature
        id: verify
        shell: bash
        env:
          EXPECTED_PACKAGE: kr.co.heowork0921.lostparty
          EXPECTED_CERT_SHA256: 8ef16c58cbb605e2c74c99c4d8e9f252b00c3dd90837594d5e5ca40f0caed030
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
        run: |
          set -euo pipefail

          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools_dir="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"

          badging="$($aapt dump badging "$apk" | head -n 1)"
          [[ "$badging" == *"name='$EXPECTED_PACKAGE'"* ]]
          [[ "$badging" == *"versionCode='$VERSION_CODE'"* ]]
          [[ "$badging" == *"versionName='$VERSION_NAME'"* ]]

          signer_output="$($apksigner verify --verbose --print-certs "$apk")"
          certificate_sha256="$(printf '%s\n' "$signer_output" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if [[ "$certificate_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "APK certificate does not match the approved release key." >&2
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/$ASSET_NAME"
          (
            cd dist
            sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          )

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/${{ steps.metadata.outputs.asset_name }}
            dist/${{ steps.metadata.outputs.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/lostparty-release.jks"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v2.1.0'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out approved release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified APK artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists." >&2
            exit 1
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/lostparty-${GITHUB_REF_NAME}-android.apk"
          "dist/lostparty-${GITHUB_REF_NAME}-android.apk.sha256"
          --verify-tag
          --repo "$GITHUB_REPOSITORY"
          --title "LOSTPARTY $VERSION_NAME"
          --notes-file "docs/releases/v${VERSION_NAME}.md"

  promote:
    name: Publish accepted 2.1.0 artifacts without rebuilding
    if: github.ref == 'refs/tags/v2.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and download the exact accepted artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect main.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Tag source is not on main.' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout source differs.' }
          $record = Get-Content -Raw docs/releases/v2.1.0-artifacts.json | ConvertFrom-Json
          if ($record.tag -ne $env:GITHUB_REF_NAME -or $record.repository -ne $env:GITHUB_REPOSITORY) { throw 'Unexpected release.' }
          New-Item -ItemType Directory dist | Out-Null
          foreach ($artifact in $record.artifacts) {
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($artifact.run_id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or
                $run.head_sha -ne $artifact.source -or $run.event -ne 'workflow_dispatch') { throw 'Accepted run provenance differs.' }
            $meta = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.artifact_id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $meta.expired -or [DateTimeOffset]::Parse($meta.expires_at) -le [DateTimeOffset]::UtcNow -or
                $meta.name -cne $artifact.name -or $meta.workflow_run.id -ne $artifact.run_id -or
                $meta.workflow_run.head_sha -ne $artifact.source) { throw 'Accepted artifact is unavailable or differs.' }
            gh run download $artifact.run_id --repo $env:GITHUB_REPOSITORY --name $artifact.name --dir dist
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download the accepted artifact. Do not substitute another run.' }
          }
          ./tool/verify_prepared_release.ps1 -Directory dist
      - name: Create draft with the original five files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v2.1.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release exists. Do not overwrite.' }
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create v2.1.0 @assets --draft --verify-tag --repo $env:GITHUB_REPOSITORY --title 'LOSTPARTY 2.1.0' --notes-file docs/releases/v2.1.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed. Inspect the existing state before retrying.' }
      - name: Verify hosted draft bytes and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v2.1.0 --repo $env:GITHUB_REPOSITORY --dir hosted
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify hosted draft.' }
          ./tool/verify_prepared_release.ps1 -Directory hosted
          gh release edit v2.1.0 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed. Inspect the release state before retrying.' }
