name: Party scalability Rules proof

on:
  workflow_dispatch:
  push:
    branches:
      - feature/party-group-command-redesign
    paths:
      - .github/workflows/party-scalability-proof.yml
      - tools/package.json
      - tools/package-lock.json
      - tools/party_scalability_firebase.json
      - tools/party_scalability_proof.rules
      - tools/party_scalability_rules_test.mjs

permissions:
  contents: read

jobs:
  firestore-rules-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install proof dependencies
        run: npm ci --prefix tools

      - name: Run isolated Firestore Rules proof
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --config tools/party_scalability_firebase.json
          --only firestore
          --project demo-party-scalability
          "node tools/party_scalability_rules_test.mjs"
